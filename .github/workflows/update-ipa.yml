name: Auto Update IPA & Build

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: ipa-update-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate latest decrypted IPAs
        env:
          IPA_PROVIDER_TIMEOUT: "60"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa-output"

          while IFS=$'\t' read -r builder provider; do
            [ -n "$builder" ] || continue
            output_file="$RUNNER_TEMP/ipa-output/${builder}.env"
            echo "==> Validating ${builder} (${provider})"
            GITHUB_OUTPUT="$output_file" python watcher.py --builder "$builder" --version latest

            ipa_url="$(awk -F= '$1=="ipa_url" {print substr($0, index($0,"=")+1)}' "$output_file" | tail -1)"
            verified="$(awk -F= '$1=="verified" {print $2}' "$output_file" | tail -1)"
            version="$(awk -F= '$1=="version" {print $2}' "$output_file" | tail -1)"
            sha256="$(awk -F= '$1=="sha256" {print $2}' "$output_file" | tail -1)"

            [ "$verified" = "true" ] || { echo "::error::${builder}: IPA validation failed"; exit 1; }
            [ -n "$ipa_url" ] || { echo "::error::${builder}: watcher returned no IPA URL"; exit 1; }

            printf '%s\n' "$ipa_url" > "$RUNNER_TEMP/ipa-output/${builder}.url"
            echo "Validated ${builder}: ${version} (${sha256})"
          done < <(python - <<'PY'
          import json
          with open("sources.json", encoding="utf-8") as f:
              data = json.load(f)
          for app in data.get("apps", data.get("sources", [])):
              if app.get("builder") and app.get("provider") == "decrypt_ipa":
                  print(f"{app['builder']}\t{app.get('provider', '')}")
          PY
          )

      - name: Run tests
        run: pytest tests/ -v

      - name: Dispatch validated builds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for url_file in "$RUNNER_TEMP"/ipa-output/*.url; do
            [ -f "$url_file" ] || continue
            builder="$(basename "$url_file" .url)"
            ipa_url="$(cat "$url_file")"

            case "$builder" in
              ytkace)
                echo "==> Dispatching YTKACE build"
                gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
                  -f event_type='ytkace-build' \
                  -f client_payload[ipa_url]="$ipa_url"
                ;;
              ryukgram)
                echo "==> Dispatching RyukGram build"
                gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
                  -f event_type='ryukgram-build' \
                  -f client_payload[decrypted_instagram_url]="$ipa_url" \
                  -f client_payload[target]='latest'
                ;;
              *)
                echo "No build dispatch configured for ${builder}"
                ;;
            esac
          done

      - name: Commit state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi
          git commit -m "chore: update IPA validation state"
          git push
