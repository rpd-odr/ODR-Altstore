name: Update IPA source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
      - 'sources.json'
      - 'scripts/**'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ipa-source
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Mirror latest upstream IPA releases
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/update_apps.py

      - name: Commit generated source and state
        run: |
          git config user.name 'ODR Altstore Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps.json state.json
          if git diff --cached --quiet; then
            echo 'No source changes.'
          else
            git commit -m 'Update mirrored apps'
            git push
          fi
