name: Validate provider

on:
  push:
    paths:
      - 'providers/**'
      - 'watcher.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/provider-tests.yml'
  pull_request:
    paths:
      - 'providers/**'
      - 'watcher.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/provider-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
